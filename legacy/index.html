<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#ff1493">
    <title>BR 매장관리</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div id="app">
        <!-- Content loaded by JS -->
    </div>

    <script src="supabase.js"></script>
    <script src="auth.js"></script>
    <script src="app.js"></script>
    <script>
        // Initialize app
        async function initApp() {
            const online = await initSupabase();
            
            // Render header with user info
            const appEl = document.getElementById('app');
            appEl.innerHTML = `
                <!-- Header -->
                <header id="app-header">
                    <select id="storeSelect" class="header-store-select">
                        ${userStores.map(s => `
                            <option value="${s.store_id}" ${s.store_id === STORE_ID ? 'selected' : ''}>
                                🏪 ${s.stores?.name || '매장'}
                            </option>
                        `).join('')}
                    </select>
                    <div id="sync-status" class="sync-status local">💾</div>
                    <button class="header-btn" id="userMenuBtn">${currentUser?.name?.charAt(0) || '?'}</button>
                </header>
                
                <!-- Main Navigation -->
                <nav id="main-nav">
                    ${canAccess('inventory') ? '<button class="nav-btn active" data-page="inventory"><span class="nav-icon">🍨</span><span class="nav-label">재고</span></button>' : ''}
                    <button class="nav-btn ${!canAccess('inventory') ? 'active' : ''}" data-page="timesheet"><span class="nav-icon">👥</span><span class="nav-label">근무</span></button>
                    ${canAccess('sales') ? '<button class="nav-btn" data-page="sales"><span class="nav-icon">📊</span><span class="nav-label">판매</span></button>' : ''}
                </nav>

                <!-- Pages -->
                <main id="content">
                    <section id="inventory" class="page ${canAccess('inventory') ? 'active' : ''}"></section>
                    <section id="timesheet" class="page ${!canAccess('inventory') ? 'active' : ''}"></section>
                    <section id="sales" class="page"></section>
                </main>
            `;
            
            // Setup navigation
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.onclick = () => {
                    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
                    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
                    btn.classList.add('active');
                    document.getElementById(btn.dataset.page).classList.add('active');
                };
            });
            
            // Store selector
            const storeSelect = document.getElementById('storeSelect');
            if (storeSelect) {
                storeSelect.onchange = async () => {
                    await switchStore(storeSelect.value);
                };
            }
            
            // User menu
            document.getElementById('userMenuBtn').onclick = showUserMenu;
            
            // Load data and render
            if (online) await loadFromCloud();
            if (canAccess('inventory')) renderInventory();
            renderTimesheet();
            if (canAccess('sales')) renderSales();
            updateSyncUI();
        }
        
        function showUserMenu() {
            const modal = document.createElement('div');
            modal.className = 'modal show';
            modal.innerHTML = `
                <div class="modal-content">
                    <div class="modal-title">${currentUser?.name || '사용자'}</div>
                    <div class="user-role-display">${currentUser?.role === 'owner' ? '👑 점주' : currentUser?.role === 'manager' ? '🏷️ 매니저' : '👤 알바'}</div>
                    ${isOwner() ? '<button class="menu-btn" id="manageUsersBtn">👥 사용자 관리</button>' : ''}
                    ${isOwner() ? '<button class="menu-btn" id="manageStoresBtn">🏪 매장 관리</button>' : ''}
                    <button class="menu-btn" id="changePwBtn">🔐 비밀번호 변경</button>
                    <button class="menu-btn logout" id="logoutBtn">🚪 로그아웃</button>
                    <div class="modal-actions">
                        <button class="modal-btn cancel">닫기</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
            
            modal.querySelector('.cancel').onclick = () => modal.remove();
            modal.querySelector('#logoutBtn').onclick = () => { modal.remove(); logout(); };
            modal.querySelector('#changePwBtn').onclick = () => { modal.remove(); showChangePasswordModal(); };
            if (isOwner()) {
                modal.querySelector('#manageUsersBtn').onclick = () => { modal.remove(); showUserManagement(); };
                modal.querySelector('#manageStoresBtn').onclick = () => { modal.remove(); showStoreManagement(); };
            }
        }
        
        // Start
        (async () => {
            await initSupabase();
            if (currentUser) {
                // Load user's stores on refresh
                const { data: storeLinks } = await supabaseClient
                    .from('store_users')
                    .select('store_id, role, stores(id, name)')
                    .eq('user_id', currentUser.id);
                userStores = storeLinks || [];
                
                // Restore last selected store or use first
                const savedStoreId = localStorage.getItem('br_store_id');
                if (savedStoreId && userStores.some(s => s.store_id === savedStoreId)) {
                    STORE_ID = savedStoreId;
                } else if (userStores.length > 0) {
                    STORE_ID = userStores[0].store_id;
                }
                
                initApp();
            } else {
                showLoginScreen();
            }
        })();
    </script>
</body>
</html>
