<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#ff1493">
    <title>BR 매장관리</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div id="app">
        <!-- Sync Status -->
        <div id="sync-status" class="sync-status local">💾 로컬저장</div>
        
        <!-- Main Navigation -->
        <nav id="main-nav">
            <button class="nav-btn active" data-page="inventory">
                <span class="nav-icon">🍨</span>
                <span class="nav-label">재고</span>
            </button>
            <button class="nav-btn" data-page="timesheet">
                <span class="nav-icon">👥</span>
                <span class="nav-label">근무</span>
            </button>
            <button class="nav-btn" data-page="sales">
                <span class="nav-icon">📊</span>
                <span class="nav-label">판매</span>
            </button>
        </nav>

        <!-- Pages -->
        <main id="content">
            <section id="inventory" class="page active"></section>
            <section id="timesheet" class="page"></section>
            <section id="sales" class="page"></section>
        </main>
    </div>

    <script src="app.js"></script>
    <script src="supabase.js"></script>
    <script>
        // Initialize Supabase and load data
        (async () => {
            const online = await initSupabase();
            if (online) {
                await loadFromCloud();
                renderInventory();
                renderTimesheet();
                renderSales();
            }
        })();
    </script>
</body>
</html>
